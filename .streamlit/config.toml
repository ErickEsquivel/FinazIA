# Tema visual de FinanzIA.
# El usuario elige claro, oscuro o "según el sistema" desde el menú ⋮ → Settings.

[client]
toolbarMode = "minimal"

[theme]
baseRadius = "0.75rem"
showWidgetBorder = true

[theme.light]
primaryColor = "#0E9F6E"
backgroundColor = "#F6F7F9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#16181D"
borderColor = "#E3E6EB"

[theme.dark]
primaryColor = "#2BC48A"
backgroundColor = "#0F1115"
secondaryBackgroundColor = "#1A1D24"
textColor = "#E8EAED"
borderColor = "#2A2E37"
